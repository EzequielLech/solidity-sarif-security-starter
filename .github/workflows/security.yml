name: ChainGuard Security Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  security-gate:
    name: Solidity & MCP Security Scan (SARIF 2.1.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ChainGuard Web3 & MCP Security Gate
        id: chainguard
        uses: EzequielLech/chainguard-mcp@v1.4.1
        with:
          path: "."
          sarif-file: "chainguard.sarif"
          fail-on-block: "true"

      - name: Archive SARIF 2.1.0 Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chainguard-sarif-report
          path: chainguard.sarif

      - name: Upload SARIF to GitHub Code Scanning (when enabled)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: chainguard.sarif
